# A throwaway MySQL server for `npm run test:db`, matching production's version. CI starts it the
# same way (.github/workflows/ci.yml). Data lives in memory (tmpfs) and durability is switched off,
# since every run rebuilds its databases from migrations/ anyway.
#
#   docker compose -f docker-compose.test-db.yml up -d --wait
#   TEST_DB_HOST=127.0.0.1 TEST_DB_PORT=3307 TEST_DB_USER=root TEST_DB_PASSWORD=test npm run test:db
#   docker compose -f docker-compose.test-db.yml down
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: test
    ports:
      # 3307, so it doesn't clash with a MySQL already on the standard port.
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    command:
      - --skip-log-bin
      - --innodb-doublewrite=OFF
      - --innodb-flush-log-at-trx-commit=0
      - --sync-binlog=0
    healthcheck:
      # Over TCP, not the socket: the image's init phase runs a socket-only server first, which
      # would pass a socket ping before the real server is listening.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptest", "--silent"]
      interval: 1s
      timeout: 2s
      retries: 120
