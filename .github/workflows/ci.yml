name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          # The runner image's cached 24.x can lag behind the `engines` floor, which engine-strict
          # (.npmrc) then rejects; always resolve the latest 24.x release instead.
          check-latest: true
          cache: 'npm'

      # Restores node_modules itself, keyed on the exact OS + Node version + package.json +
      # lockfile, so a hit skips `npm ci` entirely (~25s on Windows, ~8s on Ubuntu — including
      # ffmpeg-static's postinstall download). package.json is in the key so a manifest edit the
      # lockfile doesn't match still reaches `npm ci` and fails there, as it would on deploy. Only
      # an exact match is restored, never a fallback: a stale tree could hide an install problem.
      # A miss falls through to the `npm ci` below, and the resulting tree is saved for next time.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            npm ci && break
            if [ "$attempt" -eq 4 ]; then
              echo "npm ci failed after 4 attempts" >&2
              exit 1
            fi
            delay=$((2 ** attempt))
            echo "npm ci failed (attempt $attempt/4). Retrying in ${delay}s..."
            sleep "$delay"
          done

      # Vitest's on-disk transform cache (see vitest.config.mts). Keyed per commit so every run
      # saves a fresh copy, restoring the newest one for the same OS + lockfile + Vitest config.
      - name: Restore Vitest transform cache
        uses: actions/cache@v6
        with:
          path: .vitest-cache
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.mts') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.mts') }}-

      # The tests run straight from src/ (Vitest transforms on the fly), so nothing here depends on
      # the build's output: the build, lint (type-aware ESLint, about as long as the tests and mostly
      # single-threaded), the circular-dependency and unused-code (knip) checks and the ts-node
      # toolchain check all run in the background while the tests stream in the foreground
      # (scripts/ci-parallel.sh).
      # Coverage is only uploaded from Ubuntu, so Windows runs plain `npm test`; lint and the
      # circular and unused-code checks are platform-independent, so they run on Ubuntu only.
      - name: Build, lint, circular-dependency and unused-code checks, toolchain check and tests with coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/ci-parallel.sh test:coverage build lint check:circular check:unused test:toolchain

      - name: Build, toolchain check and tests
        if: matrix.os == 'windows-latest'
        shell: bash
        run: bash scripts/ci-parallel.sh test build test:toolchain

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/coverage-report.txt
          retention-days: 30

      # The coverage job below publishes this to Qlty.
      - name: Keep lcov coverage for the Qlty upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1

  # Publishes coverage in a job of its own, so only this job can mint the OIDC token qlty-action
  # trades for a Qlty upload; the install, build and test steps above never see it. GitHub gives
  # fork and Dependabot pull requests no OIDC token, and qlty-action fails the job when it can't
  # get one, so those runs skip the upload.
  # It also waits for its test job to pass: a failed one leaves no report to upload.
  coverage:
    name: Publish coverage to Qlty
    needs: ci
    if: >-
      needs.ci.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Qlty checks the report's source paths against the checkout.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download lcov coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: coverage

      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage/lcov.info
