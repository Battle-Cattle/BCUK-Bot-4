# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    ignore:
      # `typescript` stays on 6.x until typescript-eslint, eslint-plugin-sonarjs and madge support
      # TypeScript 7 (they load its JS API, which 7.x doesn't expose); type-checking and the build
      # already run on 7.x through the `typescript7` alias. See CLAUDE.md "TypeScript 6 + 7".
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      twurple:
        patterns:
          - "@twurple/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
